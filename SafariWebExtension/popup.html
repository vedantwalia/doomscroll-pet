<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doomscroll Pet</title>
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { width: 290px; margin: 0; padding: 16px; color: CanvasText; background: Canvas; }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    header span { font-size: 24px; }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 3px 0 0; color: GrayText; font-size: 12px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-weight: 600; }
    select, textarea { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 7px; background: Field; color: FieldText; font: inherit; }
    textarea { height: 88px; resize: vertical; line-height: 1.4; }
    .hint { margin-top: 5px; font-size: 11px; color: GrayText; }
    button { width: 100%; margin-top: 15px; padding: 9px 12px; border: 0; border-radius: 8px; background: #7956d8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 16px; margin-top: 8px; font-size: 11px; color: GrayText; }
    #status.error { color: #c43c35; }
  </style>
</head>
<body>
  <header><span aria-hidden="true">🐈</span><div><h1>Doomscroll Pet</h1><p>A gentle nudge after a long visit.</p></div></header>
  <label class="toggle"><input id="enabled" type="checkbox"> Enable site monitoring</label>
  <label for="threshold">Nudge me after</label>
  <select id="threshold">
    <option value="1">1 minute</option>
    <option value="5">5 minutes</option>
    <option value="10">10 minutes</option>
    <option value="15">15 minutes</option>
  </select>
  <label for="domains">Watched domains</label>
  <textarea id="domains" spellcheck="false" aria-describedby="domain-hint"></textarea>
  <div class="hint" id="domain-hint">One domain per line, such as youtube.com</div>
  <button id="save" type="button">Save settings</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
