<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doomscroll Pet</title>
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { width: 300px; margin: 0; padding: 16px; color: CanvasText; background: Canvas; }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    header span { font-size: 24px; }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 3px 0 0; color: GrayText; font-size: 12px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-weight: 600; }
    select, input[type="text"] { box-sizing: border-box; padding: 8px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 7px; background: Field; color: FieldText; font: inherit; }
    select { width: 100%; }
    .site-entry { display: flex; gap: 7px; }
    .site-entry input { min-width: 0; flex: 1; }
    .site-list { display: grid; gap: 6px; margin: 9px 0 0; padding: 0; list-style: none; }
    .site-list li { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; background: color-mix(in srgb, CanvasText 7%, transparent); }
    .remove { padding: 2px 6px; border: 0; background: transparent; color: GrayText; font: inherit; cursor: pointer; }
    .hint { margin-top: 5px; font-size: 11px; color: GrayText; }
    button.primary, .site-entry button { padding: 8px 11px; border: 0; border-radius: 7px; background: #7956d8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { width: 100%; margin-top: 15px; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 16px; margin-top: 8px; font-size: 11px; color: GrayText; }
    #status.error { color: #c43c35; }
  </style>
</head>
<body>
  <header><span aria-hidden="true">🐈</span><div><h1>Doomscroll Pet</h1><p>Your cat will visit near the time limit.</p></div></header>
  <label class="toggle"><input id="enabled" type="checkbox"> Enable site monitoring</label>
  <label for="threshold">Visit limit</label>
  <select id="threshold">
    <option value="1">1 minute</option>
    <option value="5">5 minutes</option>
    <option value="10">10 minutes</option>
    <option value="15">15 minutes</option>
  </select>
  <label for="site-input">Watched websites</label>
  <div class="site-entry">
    <input id="site-input" type="text" placeholder="reddit.com" autocomplete="off" spellcheck="false">
    <button id="add-site" type="button">Add</button>
  </div>
  <div class="hint">Start with Instagram and Reddit. Add a domain or website address.</div>
  <ul class="site-list" id="site-list" aria-label="Watched websites"></ul>
  <button class="primary" id="save" type="button">Save settings</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
